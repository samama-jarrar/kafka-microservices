spring.application.name=order-analytics-service

server.port=8085

spring.kafka.bootstrap-servers=localhost:9092

# --- Kafka Streams ---
# application-id doubles as the consumer group id AND the prefix for internal
# state-store/changelog/repartition topics. It MUST be unique per streams app.
spring.kafka.streams.application-id=order-analytics-streams

# Start from the beginning so analytics include events produced before this app started.
spring.kafka.streams.properties.auto.offset.reset=earliest

# Commit/flush interval for the state stores (kept low so the demo feels live).
spring.kafka.streams.properties.commit.interval.ms=1000

# Default SerDes. We still set SerDes explicitly in the topology for clarity,
# but these are the fallback for any operation that does not specify one.
spring.kafka.streams.properties.default.key.serde=org.apache.kafka.common.serialization.Serdes$StringSerde
spring.kafka.streams.properties.default.value.serde=org.apache.kafka.common.serialization.Serdes$StringSerde

# --- Topic names ---
app.topic.orders=orders-topic
app.topic.product-sales=product-sales-topic
app.topic.orders-windowed=orders-per-product-windowed-topic

# --- State store names (used by interactive queries) ---
app.store.product-sales=product-sales-store
